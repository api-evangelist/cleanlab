name: Cleanlab
kind: company
description: Cleanlab is a data-and-AI trust platform. Its Trustworthy Language Model
  (TLM) wraps any LLM with a real-time trustworthiness score to catch hallucinations,
  Cleanlab Studio curates and labels training data and deploys reliable ML models,
  and Codex adds a safety, guardrail, and remediation layer for AI assistants and
  RAG. The open-source cleanlab library underpins it all with data-centric AI.
